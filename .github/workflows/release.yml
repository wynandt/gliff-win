# Tag-triggered release. Same idea as Gliff's release job (tag must equal the
# Cargo.toml version, gh release create --generate-notes) plus what a Windows
# download needs: a zip, a SHA-256 file, and a build-provenance attestation.
#
# Hardening (docs/development.md, "CI and release"): the tagged commit must
# already be on main, every action is pinned to a commit hash, the build has no
# cache, and the token that can write releases is visible to the publish step
# only.
#
# To cut a release:
#   1. bump `version` in the workspace Cargo.toml (and Cargo.lock), merge it to main
#   2. git tag v0.2.0 && git push origin v0.2.0   (from the merged commit)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag can point at any commit, including one on an unreviewed branch.
  # Build only commits that are on main.
  guard:
    name: tagged commit is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be an ancestor of origin/main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge it to main first, then tag the merged commit."
            exit 1
          fi

  ci:
    needs: guard
    permissions:
      contents: read
    # A job-level call of a reusable workflow is read from the running commit,
    # not from a work tree a step could change. actionlint does not accept the
    # `$/` form yet; switch to it and drop the ignore when it does.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  release:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write      # create the release
      id-token: write      # attestation signing
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against Cargo.toml
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::version in Cargo.toml is not a plain semantic version"
            exit 1
          fi
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # OpenH264's C and asm sources need nasm; the script installs a pinned
      # version and checks its SHA-256.
      - name: Install nasm
        shell: pwsh
        run: ./scripts/install-nasm-windows.ps1

      # Installs the exact version in rust-toolchain.toml. No build cache here:
      # a cache written by another run would be an input to the release binary.
      - name: Install Rust
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked -p gliff-windows

      - name: Package
        id: package
        shell: bash
        run: |
          name="gliff-win-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc"
          mkdir "$name"
          cp target/release/gliff-windows.exe LICENSE NOTICE README.md "$name/"
          7z a "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "zip=$name.zip" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.package.outputs.zip }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ZIP" \
            "$ZIP.sha256" \
            --title "gliff-win $VERSION" \
            --generate-notes
