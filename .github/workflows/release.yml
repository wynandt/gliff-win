# Release for gliff-win. A pushed `v*` tag builds the Windows programs, signs
# them with Azure Artifact Signing, and publishes a GitHub release: a zip of
# both programs with LICENSE, NOTICE, README.md and CHANGELOG.md, SHA256SUMS,
# a build-provenance attestation, and the CHANGELOG.md section for the version
# as the notes.
#
# `build` has a read-only token, checks the release notes early, builds the
# programs, verifies their version output, packages an unsigned release, and
# uploads `build-unsigned` (the exes) and `release-unsigned` (the zip and sums).
# `sign` runs on tags only with the `release` environment, downloads the unsigned
# exes, signs them with Azure Artifact Signing (OIDC), verifies the signatures,
# checks they still run, repackages from the signed exes, and uploads
# `release-signed`. `publish` has the only write permission, runs on a tag push
# only and checks out no code: it downloads `release-signed`, checks the sums
# and creates the release.
#
# Dry run: a pull request that changes the release files, or a manual run from
# the Actions tab, builds and packages an unsigned release artifact and publishes
# nothing. `sign` and `publish` are skipped.
#
# Hardening (docs/development.md, "CI and release"): a tagged commit must
# already be on main, every action is pinned to a commit hash, the build has no
# cache, and the token that can write releases is visible to one step only.
#
# To cut a release, see CONTRIBUTING.md, "Releasing".
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release-notes"
      - "scripts/package-release"
      - "scripts/install-nasm-windows.ps1"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can point at any commit, including one on an unreviewed branch.
  # Build only commits that are on main. A dry run has no tag to check.
  guard:
    name: tagged commit is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be an ancestor of origin/main
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag ]]; then
            echo "::notice::Dry run on $GITHUB_REF_NAME: nothing will be published."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge it to main first, then tag the merged commit."
            exit 1
          fi

  ci:
    needs: guard
    permissions:
      contents: read
    # A job-level call of a reusable workflow is read from the running commit,
    # not from a work tree a step could change. actionlint does not accept the
    # `$/` form yet; switch to it and drop the ignore when it does.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  build:
    name: build (windows)
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On a tag push the tag must be v + the Cargo.toml version.
      - name: Check the tag against Cargo.toml
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::version in Cargo.toml is not a plain semantic version"
            exit 1
          fi
          if [[ "$REF_TYPE" == tag && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Fails here, before the long build, when CHANGELOG.md has no section for
      # the version.
      - name: Write the release notes
        shell: bash
        run: |
          mkdir -p dist
          scripts/release-notes > dist/RELEASE_NOTES.md

      # OpenH264's C and asm sources need nasm; the script installs a pinned
      # version and checks its SHA-256.
      - name: Install nasm
        shell: pwsh
        run: ./scripts/install-nasm-windows.ps1

      # Installs the exact version in rust-toolchain.toml. No build cache here:
      # a cache written by another run would be an input to the release binary.
      - name: Install Rust
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --workspace --locked

      # gliff-windows.exe is a GUI program; piping its output lets it be read.
      - name: Check the version the program prints
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $out = (& target/release/gliff-windows.exe --version | Out-String).Trim()
          Write-Host "gliff-windows.exe --version -> $out"
          if ($LASTEXITCODE -ne 0 -or $out -ne "gliff-windows $env:VERSION") {
            throw "expected 'gliff-windows $env:VERSION'"
          }
          $out = (& target/release/gwin-verify.exe --version | Out-String).Trim()
          Write-Host "gwin-verify.exe --version -> $out"
          if ($LASTEXITCODE -ne 0 -or $out -ne "gwin-verify $env:VERSION") {
            throw "expected 'gwin-verify $env:VERSION'"
          }

      - name: Package unsigned release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-release

      - name: Upload the unsigned binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-unsigned
          path: |
            target/release/gliff-windows.exe
            target/release/gwin-verify.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the unsigned release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14

  sign:
    name: sign (windows)
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the unsigned binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-unsigned
          path: target/release

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign both executables
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: wynandt-signing
          certificate-profile-name: gliff-win-public
          files-folder: target/release
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Find signtool.exe
        id: signtool
        shell: pwsh
        run: |
          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          if (-not (Test-Path $kitsRoot)) {
            throw "Windows Kits 10 bin folder not found at $kitsRoot"
          }
          $signtool = Get-ChildItem -Path $kitsRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found under $kitsRoot"
          }
          Write-Host "Found signtool at: $($signtool.FullName)"
          "path=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify signatures
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.signtool.outputs.path }}
        run: |
          & $env:SIGNTOOL verify /pa target/release/gliff-windows.exe
          if ($LASTEXITCODE -ne 0) { throw "gliff-windows.exe signature verification failed" }
          & $env:SIGNTOOL verify /pa target/release/gwin-verify.exe
          if ($LASTEXITCODE -ne 0) { throw "gwin-verify.exe signature verification failed" }

      - name: Check the signed programs run
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $out = (& target/release/gliff-windows.exe --version | Out-String).Trim()
          Write-Host "gliff-windows.exe --version -> $out"
          if ($LASTEXITCODE -ne 0 -or $out -ne "gliff-windows $env:VERSION") {
            throw "expected 'gliff-windows $env:VERSION'"
          }
          $out = (& target/release/gwin-verify.exe --version | Out-String).Trim()
          Write-Host "gwin-verify.exe --version -> $out"
          if ($LASTEXITCODE -ne 0 -or $out -ne "gwin-verify $env:VERSION") {
            throw "expected 'gwin-verify $env:VERSION'"
          }

      - name: Package the signed binaries
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/package-release

      - name: Upload the signed release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # The only job with a write permission. It checks out no code.
  publish:
    name: publish release
    needs: [build, sign]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release
      id-token: write      # attestation signing
      attestations: write  # store the attestation
    steps:
      - name: Download the signed release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: dist

      - name: Check the sums
        shell: bash
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # --verify-tag: the tag must already exist; gh never makes one.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "gliff-win-v${VERSION}-x86_64-pc-windows-msvc.zip" SHA256SUMS \
            --verify-tag \
            --title "gliff-win $VERSION" \
            --notes-file RELEASE_NOTES.md \
            "${flags[@]}"
