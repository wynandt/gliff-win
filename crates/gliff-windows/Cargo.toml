[package]
name = "gliff-windows"
description = "Windows client for gliff."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The hidden flags `--test-panic` and `--hook-stall-test-ms`, which the
# verification harness uses to prove the exit paths and the hook's recovery.
# Off in every build that is released.
test-hooks = []

[dependencies]
bytes.workspace = true
clap.workspace = true
gliff-proto.workspace = true
gliff-sw.workspace = true
openh264.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
gliff-transport.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
