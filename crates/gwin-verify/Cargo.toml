[package]
name = "gwin-verify"
description = "JSON-line checks for the gliff Windows client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "gwin-verify"
path = "src/main.rs"

# Stand-in server for proving `gwin-verify ssh` and `stream` on the build machine
# (verification scaffolding only; models upstream 089662fd, cited inline).
[[bin]]
name = "gwin-fake-server"
path = "src/bin/gwin-fake-server/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
gliff-proto.workspace = true
gliff-sw.workspace = true
gliff-transport.workspace = true
gliff-windows.workspace = true
openh264.workspace = true
png.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
