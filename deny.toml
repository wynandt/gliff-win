# cargo-deny config. Start strict on advisories and sources, permissive-but-explicit on licences.
# Run locally: cargo install cargo-deny --locked && cargo deny check
# The licence allow-list is exactly what the dependency tree uses (all targets, all
# features). `cargo deny check licenses` warns when an entry is unused: remove it,
# and add one only when a new dependency needs it.
[advisories]
version = 2
yanked = "deny"
# Report unmaintained and unsound crates anywhere in the tree, not only direct dependencies.
unmaintained = "all"
unsound = "all"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "Unicode-3.0", "Zlib", "BlueOak-1.0.0"]

[bans]
multiple-versions = "warn"
# The pinned upstream gliff crates are git dependencies without a version, which
# cargo-deny reports as wildcards; path dependencies are workspace-internal.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# gliff-win pins upstream gliff by git rev, so that one git source is allowed.
allow-git = ["https://github.com/omacom/gliff"]
